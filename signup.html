<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입</title>
<style>
  :root {
    --bg: #f3f5f7;
    --panel: #ffffff;
    --text: #1d2433;
    --muted: #6b7587;
    --line: #dde2ea;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --ok: #1f8a57;
    --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141820;
      --panel: #1c212b;
      --text: #e6e9ef;
      --muted: #8f99ab;
      --line: #2c3340;
      --accent: #6b93ff;
      --accent-text: #0e1320;
      --ok: #4fd18b;
      --error: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 20px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
  }
  .switch { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; font-size: 14px; color: var(--muted); }
  button.link { width: auto; margin: 0 0 0 6px; padding: 2px 4px; background: transparent; color: var(--accent); font-size: 14px; border-radius: 4px; }
  #msg { min-height: 20px; margin: 14px 0 0; font-size: 14px; }
  #msg.ok { color: var(--ok); }
  #msg.error { color: var(--error); }
  #server-box { display: none; margin-bottom: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  #server-box.show { display: block; }
  #server-box button { margin-top: 8px; background: transparent; color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">회원가입</h1>

  <!-- GitHub Pages에서 열었을 때만 보이는 서버 주소 입력칸 -->
  <div id="server-box">
    <label for="server" style="margin-top:0">서버 주소</label>
    <input id="server" placeholder="https://xxxx.trycloudflare.com" autocomplete="off">
    <button type="button" id="server-save">서버 주소 저장</button>
  </div>

  <form id="form">
    <label for="uid">아이디</label>
    <input id="uid" autocomplete="off" required>

    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="new-password" required>

    <button type="submit" id="submit-btn">가입하기</button>
  </form>
  <p id="msg" role="status"></p>

  <p class="switch">
    <span id="switch-text">이미 계정이 있나요?</span>
    <button type="button" id="switch-btn" class="link">로그인</button>
  </p>
</div>

<script>
  // 내 PC의 Flask가 연 페이지면 같은 주소를 사용, GitHub Pages면 입력칸의 터널 주소를 사용
  const onGithub = location.hostname.endsWith("github.io");
  const serverBox = document.getElementById("server-box");
  const serverInput = document.getElementById("server");
  const msg = document.getElementById("msg");

  function read(key) {
    try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  let API = onGithub ? read("signup_server") : "";
  if (onGithub) {
    serverBox.classList.add("show");
    serverInput.value = API;
  }
  document.getElementById("server-save").onclick = () => {
    API = serverInput.value.trim().replace(/\/+$/, "");
    write("signup_server", API);
    show("서버 주소를 저장했어요", "ok");
  };

  function show(text, type) {
    msg.textContent = text;
    msg.className = type;
  }

  // 회원가입 <-> 로그인 전환
  let mode = "signup";
  const title = document.getElementById("title");
  const submitBtn = document.getElementById("submit-btn");
  const switchText = document.getElementById("switch-text");
  const switchBtn = document.getElementById("switch-btn");
  const pwInput = document.getElementById("pw");

  function setMode(next) {
    mode = next;
    const isSignup = mode === "signup";
    title.textContent = isSignup ? "회원가입" : "로그인";
    submitBtn.textContent = isSignup ? "가입하기" : "로그인";
    switchText.textContent = isSignup ? "이미 계정이 있나요?" : "아직 계정이 없나요?";
    switchBtn.textContent = isSignup ? "로그인" : "회원가입";
    pwInput.autocomplete = isSignup ? "new-password" : "current-password";
    show("", "");
  }
  switchBtn.onclick = () => setMode(mode === "signup" ? "login" : "signup");

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("uid").value.trim();
    const pw = pwInput.value;
    if (onGithub && !API) { show("먼저 서버 주소를 저장하세요", "error"); return; }
    try {
      const res = await fetch(API + "/" + mode, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, pw })
      });
      const data = await res.json();
      if (data.ok && mode === "signup") {
        show("가입이 완료됐어요. 이제 로그인해 보세요", "ok");
        e.target.reset();
        setMode("login");
        show("가입이 완료됐어요. 이제 로그인해 보세요", "ok");
      } else if (data.ok) {
        show(id + "님, 로그인됐어요", "ok");
        e.target.reset();
      } else {
        show(data.error || "요청에 실패했어요", "error");
      }
    } catch (err) {
      show("서버에 연결할 수 없어요. 파이썬 서버가 켜져 있는지 확인하세요", "error");
    }
  });
</script>
</body>
</html>

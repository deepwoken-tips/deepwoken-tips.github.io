
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .signup-button {
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-button:hover {
            background-color: #388E3C;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <button class="signup-button"
        onclick="location.href='https://deepwoken-tips.github.io/signup.html'">
        회원가입
    </button>

</body>
</html>

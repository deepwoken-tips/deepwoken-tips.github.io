<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈</title>
<style>
  :root {
    --bg: #f3f5f7;
    --panel: #ffffff;
    --line: #dde2ea;
    --accent: #2457d6;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141820;
      --panel: #1c212b;
      --line: #2c3340;
      --accent: #6b93ff;
      --accent-text: #0e1320;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
  }
  /* 회원가입 화면의 '가입하기' 버튼과 같은 디자인 */
  button {
    width: 100%;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<div class="card">
  <button type="button" id="go">로그인</button>
</div>

<script>
  // 버튼을 누르면 이동할 사이트 주소 (원하는 주소로 바꾸세요)
  // 예: "https://deepwoken-tips.github.io/signup.html"
  const SITE_URL = "index.html";

  // 로그인 정보(#token=...)가 있으면 그대로 이어서 전달
  document.getElementById("go").onclick = () => {
    location.href = SITE_URL + location.hash;
  };
</script>
</body>
</html>
